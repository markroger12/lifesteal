# ---------------------------------------------------------------------------
# LifeCore build properties
#
# To rebrand the plugin, change pluginName / pluginMain / group here and move
# the Java package (src/main/java/com/example/lifecore) accordingly.
# ---------------------------------------------------------------------------
group=com.example
version=1.0.0
pluginName=LifeCore
pluginMain=com.example.lifecore.LifeCorePlugin
pluginWebsite=https://example.com/lifecore

# Compile target. The plugin only uses API that exists from 1.21 through 26.x;
# version-specific lookups are isolated in com.example.lifecore.util.compat.
paperApiVersion=1.21.11-R0.1-SNAPSHOT
apiVersion=1.21

org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.caching=true
