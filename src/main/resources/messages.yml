  duplicate: "{prefix}&cThis heart note has already been redeemed. Duplicated notes are worthless."
  success:
    chat: "{prefix}&7Redeemed &c{amount}❤&7. You now have &c{hearts}❤&7."
    actionbar: "&a+{amount}❤"
