# ╔══════════════════════════════════════════════════════════════════════╗
# ║                        LifeCore - Messages                            ║
# ╚══════════════════════════════════════════════════════════════════════╝
#
# Every message can be:
#   key: "single line"                   -> chat
#   key: ["line 1", "line 2"]            -> multi-line chat
#   key:                                 -> any combination of:
#     chat: "..." (or a list)
#     actionbar: "..."
#     title: "..."
#     subtitle: "..."
#     fade-in / stay / fade-out: ticks
#     bossbar: { text: "...", color: RED, style: SOLID, seconds: 5 }
#     sound: <id from sounds.yml>
# Use "" (empty) to disable a message.
#
# Colours: &a &l ..., hex &#FF5555 / <#FF5555>, gradients <gradient:#FF0000:#FFAA00>text</gradient>
# Start a chat line with <center> to centre it. PlaceholderAPI placeholders work everywhere.
# {prefix} inserts the prefix below.
config-version: 1

prefix: "<gradient:#FF3B3B:#FF8A5B>&lLifeCore</gradient> &8» &7"

time-units:
  days: "d"
  hours: "h"
  minutes: "m"
  seconds: "s"
  permanent: "Permanent"
  now: "now"

# Symbols used by {hearts_bar} / %lifecore_hearts_bar%
hearts-bar:
  full: "&c❤"
  half: "&#FF8A8A❥"
  empty: "&8❤"
  max-symbols: "20"

status:
  alive: "&aAlive"
  eliminated: "&cEliminated"
  banned: "&4Banned"

general:
  none: "None"
  "yes": "&aYes"
  "no": "&cNo"
  never: "Never"
  online: "&aOnline"
  enabled: "&aenabled"
  disabled: "&cdisabled"

placeholders:
  not-loaded: "-"

# ─────────────────────────────────────────────────────────────────────────
errors:
  no-permission: "{prefix}&cYou don't have permission to do that."
  player-only: "{prefix}&cOnly players can use this command."
  unknown-command: "{prefix}&cUnknown sub-command. Use &f/{label} help&c."
  usage: "{prefix}&cUsage: &f{usage}"
  invalid-amount: "{prefix}&cInvalid amount &f{input}&c. Use a positive number (half hearts like 1.5 are allowed if enabled)."
  invalid-number: "{prefix}&cInvalid number &f{input}&c (1-{max})."
  invalid-player: "{prefix}&cInvalid player name &f{player}&c."
  player-not-found: "{prefix}&cPlayer &f{player}&c has never played on this server."
  player-offline: "{prefix}&cPlayer &f{player}&c must be online."
  data-not-loaded: "{prefix}&cYour LifeCore data is not loaded. Please rejoin."
  database-unavailable: "{prefix}&cThe database is temporarily unavailable. Please try again shortly."
  internal: "{prefix}&cSomething went wrong. Staff have been informed through the console."
  in-combat: "{prefix}&cYou can't do that while in combat."
  slow-down: "{prefix}&cPlease slow down."
  login-load-failed: "&c&lLifeCore\n\n&7Your data could not be loaded right now.\n&7Please try again in a moment."

# ─────────────────────────────────────────────────────────────────────────
help:
  header:
    - ""
    - "<center><gradient:#FF3B3B:#FF8A5B>&l❤ LifeCore Help ❤</gradient> &8(&7{page}&8/&7{pages}&8)"
    - ""
  entry: " &8▪ &f{usage} &8- &7{description}"
  footer:
    - ""
    - "<center>&7Next page: &f/{label} help {next}"
  usage:
    help: "/{label} help [page]"
    menu: "/{label} menu"
    check: "/{label} check [player] [gui]"
    withdraw: "/{label} withdraw [hearts]"
    redeem: "/{label} redeem"
    revive: "/{label} revive <player> [hearts]"
    top: "/{label} top [hearts|kills|deaths|revives]"
    leaderboard: "/{label} leaderboard [type]"
    resourcepack: "/{label} resourcepack"
    admin: "/{label} admin [player]"
    setheart: "/{label} setheart <player> <hearts>"
    addheart: "/{label} addheart <player> <hearts>"
    removeheart: "/{label} removeheart <player> <hearts>"
    setmaxhearts: "/{label} setmaxhearts <player> <hearts|reset>"
    eliminate: "/{label} eliminate <player>"
    reset: "/{label} reset <player>"
    give: "/{label} give <player> <item> [amount] | note <hearts>"
    beacon: "/{label} beacon <list|menu|cancel <id> [refund]>"
    reload: "/{label} reload"
    info: "/{label} info"
    debug: "/{label} debug"
  descriptions:
    help: "Show this help."
    menu: "Open the LifeCore menu."
    check: "View hearts, stats and status."
    withdraw: "Turn hearts into a heart note."
    redeem: "Redeem the heart note in your hand."
    revive: "Revive an eliminated player."
    top: "Show a leaderboard in chat."
    leaderboard: "Open the leaderboard menu."
    resourcepack: "Download the LifeCore resource pack."
    admin: "Open the admin menu."
    setheart: "Set a player's hearts."
    addheart: "Give a player hearts."
    removeheart: "Take hearts from a player."
    setmaxhearts: "Set a player's maximum hearts."
    eliminate: "Eliminate a player."
    reset: "Reset a player."
    give: "Give LifeCore items."
    beacon: "Manage active revive beacons."
    reload: "Reload the configuration."
    info: "Plugin and integration status."
    debug: "Toggle debug logging."

# ─────────────────────────────────────────────────────────────────────────
hearts:
  cap-enforced: "{prefix}&7Your hearts were lowered from &c{previous}❤ &7to your maximum of &c{max}❤&7."

kill:
  killer:
    chat: "{prefix}&7You stole &c{gained}❤ &7from &f{victim}&7. You now have &c{killer_hearts}❤&7."
    actionbar: "&c+{gained}❤ &8| &7Killed &f{victim}"
  killer-max:
    chat: "{prefix}&7You killed &f{victim}&7 but you're at your maximum of &c{max}❤&7. Extra hearts dropped as items."
    actionbar: "&6Maximum hearts reached!"
  killer-item:
    chat: "{prefix}&7You killed &f{victim}&7! Their heart &c({reward}❤)&7 dropped - pick it up!"
    actionbar: "&cA heart dropped!"
  killer-no-gain: "{prefix}&7You killed &f{victim}&7."
  victim:
    chat: "{prefix}&f{killer} &7stole &c{lost}❤ &7from you. You have &c{victim_hearts}❤ &7left."
    title: "&c-{lost}❤"
    subtitle: "&7Killed by &f{killer}"
    fade-in: 5
    stay: 40
    fade-out: 10
  victim-no-loss: "{prefix}&7You were killed by &f{killer}&7 but lost no hearts."
  blocked:
    chat: "{prefix}&cNo hearts gained: &7{reason}"
    actionbar: "&cKill reward blocked: &7{reason}"
  broadcast: "{prefix}&f{killer} &7stole &c{lost}❤ &7from &f{victim}&7!"

death:
  natural:
    chat: "{prefix}&7You died to &f{cause}&7 and lost &c{lost}❤&7. You have &c{hearts}❤ &7left."
    actionbar: "&c-{lost}❤ &8| &7{cause}"

# Friendly names for death causes (unlisted mobs are prettified automatically).
death-causes:
  PLAYER: "a player"
  ENTITY: "a mob"
  FALL: "fall damage"
  DROWNING: "drowning"
  FIRE: "fire"
  LAVA: "lava"
  VOID: "the void"
  EXPLOSION: "an explosion"
  PROJECTILE: "a projectile"
  SUFFOCATION: "suffocation"
  LIGHTNING: "lightning"
  STARVATION: "starvation"
  FREEZE: "freezing"
  MAGIC: "magic"
  WITHER_EFFECT: "withering"
  CONTACT: "a sharp block"
  CRAMMING: "cramming"
  FLY_INTO_WALL: "kinetic energy"
  DRAGON_BREATH: "dragon breath"
  SONIC_BOOM: "a sonic boom"
  KILL_COMMAND: "a command"
  OTHER: "unknown causes"
  ADMIN: "an administrator"
  SACRIFICE: "a sacrifice"
  BLAZE: "a Blaze"
  GHAST: "a Ghast"
  WARDEN: "the Warden"
  WITHER: "the Wither"
  ENDER_DRAGON: "the Ender Dragon"
  ZOMBIE: "a Zombie"
  SKELETON: "a Skeleton"
  CREEPER: "a Creeper"
  SPIDER: "a Spider"
  ENDERMAN: "an Enderman"

anti-exploit:
  reasons:
    same-ip: "same IP address"
    alt-account: "possible alt account"
    repeated-kill: "you killed this player recently ({remaining} left)"
    rapid-kills: "too many kills in a short time"
  staff-alert: "&8[&cAnti-Exploit&8] &f{killer} &7killed &f{victim}&7 - reward blocked (&c{reason}&7)."

# ─────────────────────────────────────────────────────────────────────────
elimination:
  eliminated:
    chat:
      - ""
      - "<center>&4&l☠ YOU HAVE BEEN ELIMINATED ☠"
      - "<center>&7You ran out of hearts (&f{cause}&7)."
      - ""
    title: "&4&lELIMINATED"
    subtitle: "&7You ran out of hearts"
    fade-in: 10
    stay: 80
    fade-out: 20
  broadcast:
    chat: "{prefix}&4☠ &f{player} &7has been &celiminated&7! &8({cause})"
    bossbar:
      text: "&4☠ &f{player} &chas been eliminated"
      color: RED
      style: SOLID
      seconds: 6
  kick: "&4&lELIMINATED\n\n&7You ran out of hearts.\n&7Cause: &f{cause}\n\n&7Ban: &f{ban_time}"
  locked: "&4&lELIMINATED\n\n&7You are out of hearts.\n&7Ask a friend to revive you with a &bRevive Beacon&7!"
  ban-screen: "&4&lELIMINATED\n\n&7You ran out of hearts.\n&7Cause: &f{cause}\n\n&7You can rejoin in &c{time}&7.\n&7A friend can revive you sooner with a &bRevive Beacon&7."
  spectating:
    chat: "{prefix}&cYou are eliminated. &7You are spectating until someone revives you."
    actionbar: "&c☠ Eliminated &8- &7waiting for a revive"
  command-blocked: "{prefix}&cYou can't use that command while eliminated."
  teleport-blocked: "{prefix}&cEliminated players can't teleport to others."
  chat-blocked: "{prefix}&cEliminated players can't chat."

# ─────────────────────────────────────────────────────────────────────────
revive:
  revived:
    chat: "{prefix}&aYou have been revived by &f{reviver}&a! You have &c{hearts}❤&a."
    title: "&a&lREVIVED"
    subtitle: "&7Welcome back! &c{hearts}❤"
    fade-in: 10
    stay: 60
    fade-out: 20
  broadcast: "{prefix}&a✚ &f{player} &7has been &arevived &7by &f{reviver}&7! &8({source})"
  success: "{prefix}&aRevived &f{player}&a."
  player-success: "{prefix}&aYou revived &f{target}&a for &c{cost}❤&a!"
  not-eliminated: "{prefix}&f{player}&c is not eliminated."
  cancelled: "{prefix}&cThe revival was cancelled."
  cooldown: "{prefix}&cYou can revive another player in &f{cooldown}&c."
  not-enough-hearts: "{prefix}&cReviving costs &f{cost}❤&c and you must keep at least &f{minimum}❤&c."
  not-enough-money: "{prefix}&cReviving costs &f{money}&c."
  economy-missing: "{prefix}&cRevives cost money but no economy plugin is available. Ask an administrator."
  player-disabled: "{prefix}&cPlayers can't revive others on this server."
  in-progress: "{prefix}&cThat player is already being revived."
  self: "{prefix}&cYou can't revive yourself."
  sources:
    admin: "admin"
    player: "player"
    menu: "revive menu"
    beacon: "revive beacon"
    ban_expired: "ban expired"
    api: "plugin"

# ─────────────────────────────────────────────────────────────────────────
withdraw:
  disabled: "{prefix}&cHeart withdrawal is disabled."
  invalid-amount: "{prefix}&cYou can withdraw between &f{min}❤ &cand &f{max}❤&c."
  not-enough-hearts: "{prefix}&cYou must keep at least &f{minimum}❤ &cafter withdrawing."
  inventory-full: "{prefix}&cYour inventory is full."
  cooldown: "{prefix}&cPlease wait &f{time}&c before withdrawing again."
  failed: "{prefix}&cCould not withdraw hearts."
  success:
    chat: "{prefix}&7Withdrew &c{amount}❤&7 into a heart note. You have &c{hearts}❤ &7left."
