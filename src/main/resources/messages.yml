  cooldown: "{prefix}&cWait &f{time}&c before using that again."
  dropped-full-inventory: "{prefix}&7Your inventory was full - the item was dropped at your feet."
  received: "{prefix}&7You received &f{amount}x {item}&7."
  cannot-eat: ""

heart-item:
  at-max: "{prefix}&cYou already have your maximum of &f{max}❤&c."
  at-max-absorption: "{prefix}&7You're at your maximum hearts - gained &6absorption &7instead."
  at-max-commands: "{prefix}&7You're at your maximum hearts - the heart's power was converted."
  at-max-consumed: "{prefix}&7You're at your maximum hearts. The heart crumbles to dust."
  used:
    chat: "{prefix}&7You consumed a heart: &c+{gained}❤&7. You now have &c{total}❤&7."
    actionbar: "&c+{gained}❤"
  used-capped:
    chat: "{prefix}&7You consumed a heart: &c+{gained}❤&7 (maximum reached)."
    actionbar: "&c+{gained}❤ &8(&6max&8)"

scroll:
  not-enough-hearts: "{prefix}&cThis scroll costs &f{cost}❤&c and you must keep at least &f{minimum}❤&c."
  used:
    chat: "{prefix}&7You sacrificed &c{cost}❤&7 for &d{effects}&7 ({duration}s). &c{hearts}❤ &7left."
    title: "&4&lSACRIFICE"
    subtitle: "&c-{cost}❤ &8| &d{duration}s of power"
    fade-in: 5
    stay: 40
    fade-out: 10

heart-drop:
  dropped: "{prefix}&7A &cheart &7dropped from your victim!"
  received: "{prefix}&7You received a &cheart &7from your kill!"

security:
  staff-alert: "&8[&cSecurity&8] &f{player} &7used an invalid LifeCore item (&c{reason}&7)."
  item-confiscated: "{prefix}&cThat item is not a genuine LifeCore item and was removed."
  item-invalid: "{prefix}&cThat item is not a genuine LifeCore item."
  duplicate-note-alert: "&8[&cSecurity&8] &f{player} &7tried to redeem an already used heart note &8({note})&7."
  duplicate-beacon-alert: "&8[&cSecurity&8] &f{player} &7placed a duplicated revive beacon &8({item})&7."

combat:
  logged-out: "{prefix}&f{player} &7logged out during combat and was killed."

# ─────────────────────────────────────────────────────────────────────────
