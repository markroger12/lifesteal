  ultimate:
    enabled: true
    display-name: "&dUltimate"
    block: BEACON
    duration: 60
    durability: 400
    damage-per-hit: 20
    explosion-damage: 25
    cooldown: 300
    activation-radius: 0
    revive-hearts: 10.0
    permission: ""
    particle: beacon-ultimate
    sounds:
      start: beacon-activate
      tick: beacon-tick
      damaged: beacon-damaged
      complete: beacon-complete
      fail: beacon-fail
    commands:
      start: []
      complete: []
      fail: []
    broadcast:
      start: true
      complete: true
      fail: true
    item:
      material: BEACON
      name: "<gradient:#DA22FF:#9733EE:#FF4B2B>&lUltimate Revive Beacon</gradient>"
      lore:
        - "&7Defies death itself."
        - ""
        - "&8» &7Revival time: &f{duration}"
        - "&8» &7Durability: &f{durability}"
        - ""
        - "&#E3A6FFPlace to choose a player to revive"
      custom-model-data: 710032
      item-model: ""
      head-texture: ""
      glow: true
      enchantments: []
      flags:
        - HIDE_ENCHANTS
        - HIDE_ATTRIBUTES
    recipe:
      enabled: true
      type: SHAPED
      permission: ""
      shape:
        - "HNH"
