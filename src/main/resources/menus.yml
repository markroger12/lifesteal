# ╔══════════════════════════════════════════════════════════════════════╗
# ║                          LifeCore - Menus                             ║
# ╚══════════════════════════════════════════════════════════════════════╝
#
# Item keys:
#   slot / slots   a slot number, or slots: "0-8,36-44"
#   material, name, lore, glow, custom-model-data, amount
#   skull-owner    for PLAYER_HEAD items, e.g. "{player}"
#   permission     only shown to players with this permission
#   actions        run on click (in order):
#                    [close]  [open] <menu>  [player] <command>  [console] <command>
#                    [message] <text>  [sound] <sound id>  [withdraw] <hearts>
#                    [redeem]  [refresh]  [top] <hearts|kills|deaths|revives>
#
# Dynamic menus use "content-slots" and an "entry" template. Special item keys
# (previous, next, back, empty, confirm, cancel, ...) have built-in behaviour and
# can still have extra actions.
#
# Player placeholders: {player} {hearts} {max_hearts} {min_hearts} {hearts_bar}
# {kills} {deaths} {kdr} {revives} {times_revived} {eliminations} {killstreak}
# {best_killstreak} {status} {eliminated} {ban_time} {revive_time} {last_death}
# {last_death_cause} {last_killer} {revived_by} {revived_at} {first_join} {last_seen}
config-version: 1

# ─────────────────────────────────────────────────────────────────────────
player-menu:
  title: "<gradient:#FF3B3B:#FF8A5B>&lLifeCore</gradient> &8» &7{player}"
  rows: 5
  filler:
    enabled: true
    material: BLACK_STAINED_GLASS_PANE
    name: " "
  items:
    border:
      slots: "0-8,36-39,41-43"
      material: RED_STAINED_GLASS_PANE
      name: " "
    profile:
      slot: 4
      material: PLAYER_HEAD
      name: "<gradient:#FF3B3B:#FF8A5B>&l{player}</gradient>"
      lore:
        - "&7Status: {status}"
        - "&7Hearts: &c{hearts}❤ &8/ &c{max_hearts}❤"
        - ""
        - "&7Kills: &f{kills}  &7Deaths: &f{deaths}"
        - "&7K/D: &f{kdr}  &7Streak: &f{killstreak}"
    hearts:
      slot: 20
      material: RED_DYE
      custom-model-data: 710001
      glow: true
      name: "&c&lYour Hearts"
      lore:
        - "{hearts_bar}"
        - ""
        - "&7Current: &c{hearts}❤"
        - "&7Maximum: &c{max_hearts}❤"
        - "&7Minimum: &c{min_hearts}❤"
        - ""
        - "&8Kill players to steal their hearts."
    stats:
      slot: 22
      material: IRON_SWORD
      name: "&6&lStatistics"
      lore:
        - "&7Kills: &f{kills}"
        - "&7Deaths: &f{deaths}"
        - "&7K/D ratio: &f{kdr}"
        - "&7Best kill streak: &f{best_killstreak}"
        - "&7Revives performed: &f{revives}"
        - "&7Times revived: &f{times_revived}"
        - "&7Hearts gained: &c{hearts_gained}❤"
        - "&7Hearts lost: &c{hearts_lost}❤"
        - ""
        - "&eClick for full details"
      actions:
        - "[open] check-menu"
    status:
      slot: 24
      material: CLOCK
      name: "&e&lStatus"
      lore:
        - "&7Status: {status}"
        - "&7Last death: &f{last_death}"
        - "&7Cause: &f{last_death_cause}"
        - "&7Killer: &f{last_killer}"
    withdraw:
      slot: 29
      material: PAPER
      custom-model-data: 710010
      name: "&c&lWithdraw a Heart"
      permission: lifecore.withdraw
      lore:
        - "&7Turn &c{withdraw_min}❤ &7into a tradeable"
        - "&7heart note."
        - ""
        - "&eClick to withdraw"
      actions:
        - "[withdraw] 1"
        - "[refresh]"
    redeem:
      slot: 30
      material: WRITABLE_BOOK
      name: "&a&lRedeem a Note"
      permission: lifecore.redeem
      lore:
        - "&7Hold a heart note in your"
        - "&7main hand and click here."
        - ""
        - "&eClick to redeem"
      actions:
        - "[redeem]"
        - "[refresh]"
    revive:
      slot: 32
      material: TOTEM_OF_UNDYING
      name: "&b&lRevive a Player"
      permission: lifecore.revive
      lore:
        - "&7Bring an eliminated player back."
        - "&7Cost: &c{revive_cost}❤"
        - ""
        - "&8Tip: Revive Beacons revive for free!"
        - ""
        - "&eClick to choose a player"
      actions:
        - "[open] revive-menu"
    leaderboard:
      slot: 33
      material: GOLDEN_HELMET
      name: "&6&lLeaderboards"
      permission: lifecore.top
      lore:
        - "&7See who rules the server."
        - ""
        - "&eClick to open"
      actions:
        - "[open] leaderboard-menu"
    close:
      slot: 40
      material: BARRIER
      name: "&cClose"
      actions:
        - "[close]"
    admin:
      slot: 44
      material: COMMAND_BLOCK
      name: "&4&lAdmin Panel"
      permission: lifecore.admin.menu
      lore:
        - "&eClick to open"
      actions:
        - "[open] admin-menu"

